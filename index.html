<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>뉴스 다이제스트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* ── 토큰: 단일 강조색(blue-500) + cool-blue 중성색 ───────────────── */
  :root {
    --blue-500: oklch(0.620 0.191 258);
    --blue-50:  oklch(0.959 0.020 250);
    --grey-900: oklch(0.237 0.020 258);
    --grey-800: oklch(0.357 0.028 257);
    --grey-700: oklch(0.460 0.028 256);
    --grey-600: oklch(0.562 0.025 254);
    --grey-500: oklch(0.666 0.021 253);
    --grey-400: oklch(0.779 0.016 251);
    --grey-300: oklch(0.874 0.009 248);
    --grey-200: oklch(0.930 0.005 248);
    --grey-100: oklch(0.966 0.003 248);
    --surface:  oklch(1 0 0);
    --page:     var(--grey-100);              /* greyBackground */
    --on-blue:  oklch(1 0 0);
    --press:    oklch(0 0 0 / 0.06);
    --shadow-1: 0 1px 2px oklch(0.155 0.060 261 / 0.04), 0 1px 1px oklch(0.155 0.060 261 / 0.04);

    --r-xs: 6px; --r-m: 12px; --r-xl: 16px; --r-2xl: 20px; --r-3xl: 24px; --r-full: 999px;
    --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
    --dur-fast: 120ms; --dur-base: 200ms;
    --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --blue-500: oklch(0.630 0.192 258);
      --blue-50:  oklch(0.300 0.062 267);
      --grey-900: oklch(1 0 0);
      --grey-800: oklch(0.919 0.001 286);
      --grey-700: oklch(0.818 0.004 286);
      --grey-600: oklch(0.701 0.009 286);
      --grey-500: oklch(0.596 0.014 286);
      --grey-400: oklch(0.500 0.017 286);
      --grey-300: oklch(0.425 0.020 286);
      --grey-200: oklch(0.361 0.019 285);
      --grey-100: oklch(0.297 0.016 285);
      --surface:  oklch(0.247 0.013 285);   /* layeredBackground */
      --page:     oklch(0.174 0.006 286);   /* greyBackground */
      --press:    oklch(1 0 0 / 0.06);
      --shadow-1: none;
    }
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--page); color: var(--grey-900);
    font-family: var(--font); font-size: 15px; line-height: 1.5; letter-spacing: -0.005em;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--blue-500); outline-offset: 2px; }

  /* ── top-app-bar ─────────────────────────────────────────────────── */
  .top {
    position: sticky; top: 0; z-index: 10;
    background: var(--page);
  }
  .top-inner {
    max-width: 640px; margin: 0 auto; height: 56px; padding: 0 24px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .top h1 { margin: 0; font-size: 20px; font-weight: 700; line-height: 1.35; letter-spacing: -0.015em; }

  /* ── segmented-control ───────────────────────────────────────────── */
  .seg { display: flex; padding: 3px; gap: 2px; background: var(--grey-200); border-radius: var(--r-m); }
  .seg button {
    border: 0; background: transparent; cursor: pointer;
    height: 32px; padding: 0 14px; border-radius: 10px;
    font-size: 14px; font-weight: 600; color: var(--grey-600);
    transition: background var(--dur-base) var(--ease), color var(--dur-base) var(--ease);
  }
  .seg button[aria-selected="true"] { background: var(--surface); color: var(--grey-900); box-shadow: var(--shadow-1); }
  @media (prefers-color-scheme: dark) {
    .seg { background: var(--grey-100); }
    .seg button[aria-selected="true"] { background: var(--grey-300); }
  }

  main { max-width: 640px; margin: 0 auto; padding: 8px 24px 64px; }
  @media (max-width: 480px) {
    .top-inner, main { padding-left: 16px; padding-right: 16px; }
  }

  /* ── chip ────────────────────────────────────────────────────────── */
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 16px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; height: 34px; padding: 0 14px; border-radius: var(--r-full);
    border: 1px solid var(--grey-200); background: var(--surface); color: var(--grey-700);
    font-size: 14px; font-weight: 600; cursor: pointer; font-variant-numeric: tabular-nums;
    transition: background var(--dur-base) var(--ease), color var(--dur-base) var(--ease);
  }
  .chip[aria-pressed="true"] { background: var(--grey-900); border-color: var(--grey-900); color: var(--page); }

  /* ── card ────────────────────────────────────────────────────────── */
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .card {
    position: relative; display: block; overflow: hidden;
    background: var(--surface); border-radius: var(--r-2xl); padding: 24px;
  }
  a.card::after {
    content: ""; position: absolute; inset: 0; background: var(--press);
    opacity: 0; transition: opacity var(--dur-fast) var(--ease); pointer-events: none;
  }
  a.card:hover::after { opacity: .5; }
  a.card:active::after { opacity: 1; }
  @media (max-width: 480px) { .card { padding: 20px; } }

  /* 세 줄 요약 카드 */
  .hero { border-radius: var(--r-3xl); }
  .hero-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  .eyebrow { font-size: 13px; font-weight: 600; color: var(--blue-500); margin: 0 0 4px; }
  .hero h2 { margin: 0; font-size: 22px; font-weight: 700; line-height: 1.3; letter-spacing: -0.015em; }
  .lines { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  .lines li { display: flex; gap: 12px; align-items: flex-start; font-size: 15px; color: var(--grey-800); }
  .num {
    flex: none; width: 24px; height: 24px; border-radius: var(--r-full);
    background: var(--blue-50); color: var(--blue-500);
    display: grid; place-items: center; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums;
  }

  /* text-button */
  .tbtn {
    display: inline-flex; align-items: center; gap: 2px; min-height: 32px;
    font-size: 14px; font-weight: 600; color: var(--grey-600); white-space: nowrap;
  }
  .tbtn:hover { color: var(--grey-800); }

  /* 기사 카드 */
  .meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .badge {
    display: inline-flex; align-items: center; height: 22px; padding: 0 8px;
    border-radius: var(--r-xs); font-size: 12px; font-weight: 600;
    background: var(--blue-50); color: var(--blue-500);
  }
  .badge.neutral { background: var(--grey-100); color: var(--grey-600); }
  .date { font-size: 12px; font-weight: 500; color: var(--grey-500); font-variant-numeric: tabular-nums; margin-left: auto; }
  .card h3 { margin: 0 0 6px; font-size: 18px; font-weight: 600; line-height: 1.45; letter-spacing: -0.01em; }
  .card p { margin: 0; color: var(--grey-700); font-size: 15px; line-height: 1.5; }
  .clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .more {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--grey-200);
    font-size: 14px; font-weight: 600; color: var(--blue-500);
  }
  .more .host { color: var(--grey-500); font-weight: 500; font-size: 13px; }
  .chev { width: 16px; height: 16px; flex: none; }

  /* 아카이브 카드는 한 단계 작게 */
  .card.compact { padding: 20px; border-radius: var(--r-xl); }
  .card.compact h3 { font-size: 16px; margin-bottom: 4px; }
  .card.compact p { font-size: 14px; }

  /* ── list-header ─────────────────────────────────────────────────── */
  .list-head { display: flex; align-items: baseline; justify-content: space-between; margin: 24px 4px 12px; }
  .list-head h2 { margin: 0; font-size: 17px; font-weight: 600; }
  .list-head span { font-size: 13px; color: var(--grey-500); font-variant-numeric: tabular-nums; }

  /* ── search-field ────────────────────────────────────────────────── */
  .search { position: relative; margin: 4px 0 12px; }
  .search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; color: var(--grey-500); pointer-events: none; }
  .search input {
    width: 100%; height: 48px; padding: 0 16px 0 44px;
    border-radius: var(--r-m); border: 1px solid var(--grey-200); background: var(--surface);
    font: inherit; font-size: 16px; color: var(--grey-900); outline: none;
    transition: border-color var(--dur-base) var(--ease), box-shadow var(--dur-base) var(--ease);
  }
  .search input::placeholder { color: var(--grey-400); }
  .search input:focus { border-color: var(--blue-500); box-shadow: 0 0 0 0.5px var(--blue-500); }

  /* ── 빈 상태 / 로딩(3-dot) ───────────────────────────────────────── */
  .empty { text-align: center; padding: 48px 24px; color: var(--grey-600); }
  .empty strong { display: block; color: var(--grey-900); font-size: 17px; font-weight: 600; margin-bottom: 4px; }
  .dots { display: flex; gap: 6px; justify-content: center; padding: 64px 0; }
  .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--grey-300); animation: pulse 900ms var(--ease) infinite; }
  .dots i:nth-child(2) { animation-delay: 150ms; }
  .dots i:nth-child(3) { animation-delay: 300ms; }
  @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <h1>뉴스 다이제스트</h1>
    <div class="seg" role="tablist" aria-label="보기 전환">
      <button role="tab" data-tab="digest" aria-selected="true">요약</button>
      <button role="tab" data-tab="archive" aria-selected="false">모아본 글</button>
    </div>
  </div>
</header>

<main>
  <section id="tab-digest">
    <div class="chips" id="dates" aria-label="날짜 선택"></div>
    <div id="digest"><div class="dots"><i></i><i></i><i></i></div></div>
  </section>

  <section id="tab-archive" hidden>
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="제목이나 내용으로 찾아보세요" aria-label="검색">
    </label>
    <div class="chips" id="filters">
      <button class="chip" data-f="all" aria-pressed="true">전체</button>
      <button class="chip" data-f="topic" aria-pressed="false">관심 주제</button>
      <button class="chip" data-f="digested" aria-pressed="false">요약에 실린 글</button>
      <button class="chip" data-f="pending" aria-pressed="false">아직 안 실린 글</button>
    </div>
    <div class="list-head"><h2>모아본 글</h2><span id="count"></span></div>
    <div class="stack" id="list"></div>
  </section>
</main>

<script>
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeUrl = u => /^https?:\/\//.test(u || "") ? u : "#";
const host = u => { try { return new URL(u).hostname; } catch { return ""; } };
const day = iso => {
  if (!iso) return "";
  const d = new Date(iso);
  return isNaN(d) ? "" : `${d.getMonth() + 1}월 ${d.getDate()}일`;
};
const chev = `<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>`;
const getJSON = async p => { const r = await fetch(p, { cache: "no-store" }); if (!r.ok) throw new Error(p); return r.json(); };
const emptyState = (title, body) => `<div class="empty"><strong>${esc(title)}</strong>${esc(body)}</div>`;

function articleCard(a, { compact = false } = {}) {
  const topics = (a.topics || []).map(t => `<span class="badge">${esc(t)}</span>`).join("");
  const done = compact && a.digested_on ? `<span class="badge neutral">${esc(day(a.digested_on))} 요약에 실림</span>` : "";
  const text = compact ? (a.summary || "").replace(/(\s\.)+\s/g, " ") : a.digest;
  return `
    <a class="card${compact ? " compact" : ""}" href="${esc(safeUrl(a.link))}" target="_blank" rel="noopener">
      <div class="meta">${topics}${done}<span class="date">${esc(day(a.published))}</span></div>
      <h3>${esc(a.title)}</h3>
      <p${compact ? ' class="clamp"' : ""}>${esc(text)}</p>
      ${compact ? "" : `<div class="more"><span>원문 보기</span><span class="host">${esc(host(a.link))} ${chev}</span></div>`}
    </a>`;
}

/* ── 요약 탭 ─────────────────────────────────────────────────────── */
async function showDigest(name) {
  document.querySelectorAll("#dates .chip").forEach(c => c.setAttribute("aria-pressed", c.dataset.name === name));
  const box = document.getElementById("digest");
  box.innerHTML = `<div class="dots"><i></i><i></i><i></i></div>`;
  try {
    const d = await getJSON("digest/" + encodeURIComponent(name.replace(/\.md$/, ".json")));
    if (!d.items.length) { box.innerHTML = emptyState("관심 주제 글이 없었어요", "이 날은 고를 만한 글이 없었어요."); return; }
    box.innerHTML = `
      <div class="stack">
        <section class="card hero">
          <div class="hero-head">
            <div><p class="eyebrow">${esc(day(d.date))}</p><h2>오늘의 세 줄 요약</h2></div>
            <a class="tbtn" href="digest/${esc(name)}" download>.md 받기 ${chev}</a>
          </div>
          <ol class="lines">${d.summary.map((s, i) => `<li><span class="num">${i + 1}</span><span>${esc(s)}</span></li>`).join("")}</ol>
        </section>
        <div class="list-head"><h2>오늘 고른 글</h2><span>${d.items.length}개</span></div>
        ${d.items.map(a => articleCard(a)).join("")}
      </div>`;
  } catch {
    box.innerHTML = emptyState("요약을 불러오지 못했어요", "python rss_digest.py 를 한 번 더 실행하면 카드용 파일이 만들어져요.");
  }
}

/* ── 모아본 글 탭 ────────────────────────────────────────────────── */
let archive = [], filter = "all";
function renderArchive() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const rows = archive.filter(a =>
    (filter === "all" ||
     (filter === "topic" && (a.topics || []).length) ||
     (filter === "digested" && a.digested_on) ||
     (filter === "pending" && !a.digested_on)) &&
    (!q || (a.title + " " + a.summary).toLowerCase().includes(q)));
  document.getElementById("count").textContent = `${rows.length}개`;
  document.getElementById("list").innerHTML = rows.length
    ? rows.map(a => articleCard(a, { compact: true })).join("")
    : emptyState("찾는 글이 없어요", "다른 검색어나 필터로 찾아보세요.");
}

document.querySelectorAll(".seg button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-selected", x === b));
  document.getElementById("tab-digest").hidden = b.dataset.tab !== "digest";
  document.getElementById("tab-archive").hidden = b.dataset.tab !== "archive";
  window.scrollTo({ top: 0 });
});
document.querySelectorAll("#filters .chip").forEach(c => c.onclick = () => {
  filter = c.dataset.f;
  document.querySelectorAll("#filters .chip").forEach(x => x.setAttribute("aria-pressed", x === c));
  renderArchive();
});
document.getElementById("q").oninput = renderArchive;

(async () => {
  try {
    const idx = await getJSON("digest/index.json");
    const dates = document.getElementById("dates");
    dates.innerHTML = idx.digests.map(n =>
      `<button class="chip" data-name="${esc(n)}" aria-pressed="false">${esc(day(n.replace(".md", "")))}</button>`).join("");
    dates.querySelectorAll(".chip").forEach(c => c.onclick = () => showDigest(c.dataset.name));
    if (idx.digests.length) showDigest(idx.digests[0]);
    else document.getElementById("digest").innerHTML = emptyState("아직 요약이 없어요", "python rss_digest.py 를 실행하면 여기에 쌓여요.");

    const data = await getJSON("digest/" + idx.archive);
    archive = Object.values(data).sort((a, b) => (b.published || "").localeCompare(a.published || ""));
    renderArchive();
  } catch {
    document.getElementById("digest").innerHTML = emptyState("아직 요약이 없어요", "python rss_digest.py 를 실행하면 여기에 쌓여요.");
  }
})();
</script>
</body>
</html>
